<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal AI Interface</title>
    <style>
      :root {
        --bg: #0b0f17;
        --panel: #111827;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --border: #243244;
        --accent: #60a5fa;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 700px at 20% 0%, #111c33, var(--bg));
        color: var(--text);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      .title {
        font-size: 20px;
        letter-spacing: 0.3px;
        color: var(--muted);
      }
      .hero {
        margin-top: 10px;
        font-size: 36px;
        font-weight: 700;
      }
      .bar {
        margin-top: 24px;
        display: grid;
        grid-template-columns: 160px 1fr 120px;
        gap: 10px;
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 14px;
        backdrop-filter: blur(6px);
      }
      select,
      input,
      button {
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--text);
        padding: 12px 12px;
        font-size: 14px;
        outline: none;
      }
      input {
        width: 100%;
      }
      button {
        background: linear-gradient(180deg, #2563eb, #1d4ed8);
        border: 1px solid #1e40af;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .card {
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 14px;
      }
      .muted {
        color: var(--muted);
      }
      pre {
        margin: 10px 0 0;
        padding: 12px;
        border-radius: 12px;
        background: #0b1220;
        border: 1px solid var(--border);
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .pill {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(11, 18, 32, 0.6);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">Universal Search Interface</div>
      <div class="hero">Ask. Create. Generate.</div>

      <div class="bar">
        <select id="mode">
          <option value="query">Query (answer using memory)</option>
          <option value="search">Search memory (BM25)</option>
          <option value="generate">Generate files (JSON)</option>
          <option value="index">Index memory (store text)</option>
        </select>
        <input
          id="q"
          placeholder="Try: 'Index: The capital of France is Paris' or 'What is the capital of France?'"
        />
        <button id="go">Go</button>
      </div>

      <div class="grid">
        <div class="card">
          <div class="row">
            <span class="pill">API</span>
            <input id="api" value="http://localhost:8000" />
            <span class="muted">Tip: run backend then reload.</span>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <span class="pill">Output</span>
            <span class="muted" id="meta"></span>
          </div>
          <pre id="out">Ready.</pre>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      function pretty(x) {
        return JSON.stringify(x, null, 2);
      }

      async function post(url, body) {
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const txt = await r.text();
        let data = null;
        try {
          data = JSON.parse(txt);
        } catch {
          data = { raw: txt };
        }
        if (!r.ok) {
          throw new Error(`${r.status}: ${pretty(data)}`);
        }
        return data;
      }

      async function run() {
        const api = $("api").value.replace(/\/+$/, "");
        const mode = $("mode").value;
        const q = $("q").value.trim();
        $("meta").textContent = "";
        if (!q) return;

        $("go").disabled = true;
        $("out").textContent = "Working...";
        try {
          if (mode === "index") {
            // Simple convention: "Index: ...." indexes the suffix; otherwise index full text.
            const text = q.startsWith("Index:") ? q.slice("Index:".length).trim() : q;
            const data = await post(`${api}/v1/index`, { text, metadata: { via: "ui" } });
            $("meta").textContent = `indexed id=${data.id}`;
            $("out").textContent = pretty(data);
          } else if (mode === "search") {
            const data = await post(`${api}/v1/search`, { q, k: 5 });
            $("out").textContent = pretty(data);
          } else if (mode === "generate") {
            const data = await post(`${api}/v1/generate`, { prompt: q, max_files: 5 });
            $("meta").textContent = `provider=${data.provider} model=${data.model || "n/a"}`;
            $("out").textContent = pretty(data);
          } else {
            const data = await post(`${api}/v1/query`, { q, mode: "query", top_k: 5 });
            $("meta").textContent = `provider=${data.provider} model=${data.model || "n/a"}`;
            $("out").textContent = pretty(data);
          }
        } catch (e) {
          $("out").textContent = String(e);
        } finally {
          $("go").disabled = false;
        }
      }

      $("go").addEventListener("click", run);
      $("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") run();
      });
    </script>
  </body>
</html>
